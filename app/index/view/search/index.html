{extend name="layout"}
{block name="title"}搜索 - 图站{/block}
{block name="content"}
<div class="max-w-7xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-semibold tracking-tight mb-6">
        {notempty name="keyword"}搜索「{$keyword}」{else /}搜索{/notempty}
    </h1>
    {include file="index/_cards" /}
    {if condition="$list.has_more"}
    <div class="text-center mt-10">
        <a href="?keyword={$keyword|urlencode}&page={$list.page+1}" class="px-6 py-2.5 rounded-full bg-[#0071e3] text-white text-sm hover:opacity-90 transition">加载更多</a>
    </div>
    {/if}
</div>
{/block}
